name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. [핵심] Flutter C++ 네이티브 빌드에 필수적인 도구(Ninja, Clang) 사전 설치
      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. 어떠한 꼼수 스크립트 없이 순정 상태로 안전하게 클론
      - name: Clone llama_cpp_dart
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone --recursive https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart

      # 3. 안드로이드 환경 재생성 및 minSdkVersion 안전 상향 (21 -> 26)
      - name: Re-generate Android Project Structure
        run: |
          flutter create . --platforms=android
          
          # 최신 LLVM/C++ 라이브러리 충돌 방지를 위해 최소 안드로이드 지원 버전을 26으로 상향
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      # 4. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. 완성된 APK 저장 및 제출
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
