name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      # 안정화 버전 Flutter 3.22.3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      # 1. llama_cpp_dart 서브모듈 포함 클론
      - name: Clone llama_cpp_dart with Submodules
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone --recursive https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart

      # 2. [핵심] YAML 구조를 유지하면서 environment 제약 조건만 안전하게 수정
      - name: Safe patch llama_cpp_dart pubspec environment
        run: |
          python3 -c "
          with open('packages/llama_cpp_dart/pubspec.yaml', 'r') as f:
              lines = f.readlines()

          in_env = False
          new_lines = []
          for line in lines:
              if line.strip().startswith('environment:'):
                  in_env = True
                  new_lines.append(line)
                  continue
              if in_env and line and not line.startswith(' ') and not line.startswith('\t'):
                  in_env = False
              
              if in_env:
                  if 'sdk:' in line:
                      indent = line[:line.find('sdk:')]
                      new_lines.append(f'{indent}sdk: \">=3.0.0 <4.0.0\"\n')
                      continue
                  if 'flutter:' in line:
                      indent = line[:line.find('flutter:')]
                      new_lines.append(f'{indent}flutter: \">=3.0.0\"\n')
                      continue
              
              new_lines.append(line)

          with open('packages/llama_cpp_dart/pubspec.yaml', 'w') as f:
              f.writelines(new_lines)
          "
          echo "=== Patched pubspec.yaml ==="
          cat packages/llama_cpp_dart/pubspec.yaml | head -n 25

      # 3. 안드로이드 플랫폼 구조 생성
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 4. 의존성 패키지 설치
      - name: Install dependencies
        run: flutter pub get

      # 5. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 6. APK 아티팩트 제출
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
