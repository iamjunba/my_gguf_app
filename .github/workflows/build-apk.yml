name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # 1. 안드로이드 빌드 기본 구조 생성
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 2. Flutter 의존성 및 패키지 다운로드
      - name: Install dependencies
        run: flutter pub get

      # 3. [핵심] 프로젝트 디렉터리 내에 llama.cpp 소스 배치 후 심볼릭 링크 및 패키지 폴더 복사
      - name: Setup llama.cpp Source Code
        run: |
          # 1) 원본 llama.cpp 클론
          git clone --recursive https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp

          # 2) 프로젝트 내 android/ 디렉터리 및 android/app 디렉터리에 복사
          mkdir -p android/llama.cpp
          cp -r /tmp/llama.cpp/* android/llama.cpp/

          # 3) pub-cache 내 모든 llama_cpp_dart 패키지 안에도 완전히 복사
          for pkg in $(find $HOME/.pub-cache -type d -name "llama_cpp_dart-*"); do
            echo "Copying llama.cpp into $pkg/android/llama.cpp"
            mkdir -p "$pkg/android/llama.cpp"
            cp -r /tmp/llama.cpp/* "$pkg/android/llama.cpp/"
          done

      # 4. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. 빌드 완료된 Release APK 업로드
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
