name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # 1. 안드로이드 빌드 프로젝트 재구성
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 2. Flutter 의존성 가져오기
      - name: Install dependencies
        run: flutter pub get

      # 3. 모든 예상 위치에 llama.cpp 소스 배치
      - name: Setup llama.cpp Native Source
        run: |
          # 1) 원본 llama.cpp 클론
          rm -rf llama.cpp
          git clone --recursive https://github.com/ggerganov/llama.cpp.git llama.cpp

          # 2) android/ 디렉터리 하위에 배치
          mkdir -p android/app
          cp -r llama.cpp android/
          
          # 3) pub.dev 호스팅 캐시 디렉터리 전체 탐색 후 android/ 디렉터리에 복사
          PUB_CACHE="$HOME/.pub-cache"
          find "$PUB_CACHE" -type d -name "llama_cpp_dart*" | while read -r pkg_dir; do
            echo "Copying llama.cpp into $pkg_dir/android/"
            mkdir -p "$pkg_dir/android"
            rm -rf "$pkg_dir/android/llama.cpp"
            cp -r llama.cpp "$pkg_dir/android/llama.cpp"
          done

      # 4. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. 빌드 완료된 APK 저장 및 제출
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
