name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clone llama_cpp_dart
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone --recursive https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart

      - name: Configure Android Project & Prevent Crash
        run: |
          # 1. 안드로이드 플랫폼 파일 강제 생성 (기존 파일 충돌 방지)
          flutter create . --platforms=android --overwrite

          # 2. 메모리 부족(OOM) 방지 및 Gradle 설정
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # 3. NDK 경로 고정
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.2.9519653" >> android/local.properties

          # 4. 최소 SDK 버전을 26(Android 8.0)으로 강제 상향 (LLM 필수 조건)
          sed -i 's/minSdkVersion.*/minSdkVersion 26/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 26/g' android/app/build.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      # [추가] 빌드 전 상세 로그(--verbose)를 켜서 혹시 모를 에러를 잡기 쉽게 설정
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64 --verbose

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguv-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
