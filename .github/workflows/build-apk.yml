name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      # 1. 안드로이드 Gradle 프로젝트 최신화
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 2. 의존성 패키지 다운로드
      - name: Install dependencies
        run: flutter pub get

      # 3. 프로젝트 루트 및 pub-cache 양쪽에 llama.cpp 소스 배치
      - name: Setup llama.cpp Native Source
        run: |
          # 프로젝트 루트에 llama.cpp 클론
          if [ ! -d "llama.cpp" ]; then
            git clone --recursive https://github.com/ggerganov/llama.cpp.git llama.cpp
          fi

          # pub-cache 내부 패키지 디렉터리에도 llama.cpp 동기화
          PUB_CACHE_DIR="$HOME/.pub-cache/hosted/pub.dev"
          LLAMA_PKG=$(find "$PUB_CACHE_DIR" -maxdepth 1 -name "llama_cpp_dart-*" | head -n 1)
          if [ -n "$LLAMA_PKG" ]; then
            echo "Found llama_cpp_dart at $LLAMA_PKG"
            mkdir -p "$LLAMA_PKG/android"
            rm -rf "$LLAMA_PKG/android/llama.cpp"
            cp -r llama.cpp "$LLAMA_PKG/android/llama.cpp"
          fi

      # 4. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. 빌드 결과물(APK) 아티팩트 업로드
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
