name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      # 안정화 버전 Flutter 3.22.3
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      # 1. llama_cpp_dart 서브모듈 포함 다운로드
      - name: Clone llama_cpp_dart with Submodules
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone --recursive https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart

      # 2. [핵심 해결] sed 명령으로 pubspec.yaml 의 버전 제약 조건 완화
      - name: Patch llama_cpp_dart environment constraints
        run: |
          sed -i 's/sdk:.*/sdk: ">=3.0.0 <4.0.0"/' packages/llama_cpp_dart/pubspec.yaml
          sed -i 's/flutter:.*/flutter: ">=3.0.0"/' packages/llama_cpp_dart/pubspec.yaml
          echo "=== Patched pubspec.yaml ==="
          cat packages/llama_cpp_dart/pubspec.yaml | head -n 15

      # 3. 안드로이드 플랫폼 구조 생성
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 4. 의존성 패키지 설치
      - name: Install dependencies
        run: flutter pub get

      # 5. APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 6. APK 아티팩트 제출
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
