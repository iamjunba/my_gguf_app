name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 안드로이드 NDK & CMake 세팅
      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      # 최신 Stable 채널 Flutter 사용
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. llama_cpp_dart를 받아온 후, 서브모듈 충돌 없는 최근 검증 커밋으로 이동
      - name: Clone llama_cpp_dart Safely
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart
          cd packages/llama_cpp_dart
          
          # 안정적인 과거 특정 커밋으로 이동
          git checkout 70872270311f9d5f804f44dcb6a0a1dca8bc41a1
          
          # 서브모듈을 안전하게 동기화 (오류 발생 시 무시하고 가능한 부분만 로드)
          git submodule update --init --recursive || true

      # 2. 안드로이드 빌드 환경 구조 재생성
      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      # 3. 의존성 패키지 가져오기
      - name: Install dependencies
        run: flutter pub get

      # 4. Release APK 빌드
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # 5. APK 아티팩트 저장 및 제출
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
