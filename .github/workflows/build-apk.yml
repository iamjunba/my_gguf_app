name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # [수정됨] Ubuntu 24.04 포맷 호환 및 IPv6 무한 멈춤(Hang) 방지
      - name: Install Build Essentials (Fix APT Hang)
        run: |
          # 1. 24.04(Noble)의 새로운 파일(.sources)과 https 포맷까지 싹 다 Azure 초고속 서버로 교체
          sudo sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
          
          # 2. IPv4 강제 접속(ForceIPv4)으로 무한 멈춤 버그 방지 및 타임아웃 10초 설정
          sudo apt-get update -y -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout="10"
          sudo apt-get install -y --no-install-recommends ninja-build clang pkg-config

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clone llama_cpp_dart
        run: |
          mkdir -p packages
          rm -rf packages/llama_cpp_dart
          git clone --recursive https://github.com/netdur/llama_cpp_dart.git packages/llama_cpp_dart

      - name: Configure Android Project & Prevent Crash
        run: |
          flutter create . --platforms=android

          # 메모리 부족(OOM) 방지 (4GB 할당)
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          
          # NDK 경로 유실 방지
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.2.9519653" >> android/local.properties

          # 최소 지원 버전 상향
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/26/g' android/app/build.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
