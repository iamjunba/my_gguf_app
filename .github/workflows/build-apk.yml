name: Build On-Device LLM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK & CMake
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Re-generate Android Project Structure
        run: flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      # [핵심] 프로젝트 루트, android/, pub-cache 내부 등 예상 가능한 모든 작업 디렉터리에 llama.cpp 대치
      - name: Setup llama.cpp Source Everywhere
        run: |
          # 1) 원본 llama.cpp C++ 소스 클론
          rm -rf /tmp/llama.cpp
          git clone --recursive https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp

          # 2) 루트 및 android/ 디렉터리에 배치
          rm -rf llama.cpp android/llama.cpp android/app/llama.cpp
          cp -r /tmp/llama.cpp ./llama.cpp
          cp -r /tmp/llama.cpp ./android/llama.cpp
          mkdir -p ./android/app
          cp -r /tmp/llama.cpp ./android/app/llama.cpp

          # 3) pub-cache 패키지 디렉터리의 모든 서브디렉터리에 llama.cpp 복사 및 심볼릭 링크 생성
          PUB_CACHE="$HOME/.pub-cache"
          find "$PUB_CACHE" -type d -name "llama_cpp_dart*" | while read -r pkg_dir; do
            echo "Populating llama.cpp into $pkg_dir"
            mkdir -p "$pkg_dir/android"
            mkdir -p "$pkg_dir/android/app"
            
            rm -rf "$pkg_dir/llama.cpp" "$pkg_dir/android/llama.cpp" "$pkg_dir/android/app/llama.cpp"
            cp -r /tmp/llama.cpp "$pkg_dir/llama.cpp"
            cp -r /tmp/llama.cpp "$pkg_dir/android/llama.cpp"
            cp -r /tmp/llama.cpp "$pkg_dir/android/app/llama.cpp"
          done

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-gguf-ai-runner-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
