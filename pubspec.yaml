name: local_gguf_ai_runner
description: "On-device GGUF AI Local Runner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  llama_cpp_dart: ^0.0.7
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_lints: ^3.0.0

# meta 패키지 충돌을 방지하기 위해 호환 가능한 범위로 지정
dependency_overrides:
  typed_isolate: ^3.0.0
  meta: ^1.12.0

flutter:
  uses-material-design: true
